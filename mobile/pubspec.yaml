name: dataoff
description: "DataOff — Sistema Offline-First Empresarial"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Base de datos local ───────────────────────────────────
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # ── HTTP / API ────────────────────────────────────────────
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # ── Estado ────────────────────────────────────────────────
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # ── Conectividad ──────────────────────────────────────────
  connectivity_plus: ^6.0.3

  # ── Almacenamiento seguro (tokens JWT) ───────────────────
  flutter_secure_storage: ^9.2.2

  # ── UUID (generación offline) ─────────────────────────────
  uuid: ^4.4.0

  # ── Navegación ───────────────────────────────────────────
  go_router: ^14.1.4

  # ── UI & UX ───────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # ── Utilidades ────────────────────────────────────────────
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  get_it: ^7.7.0          # Service locator / DI
  injectable: ^2.4.1
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  injectable_generator: ^2.6.1
  retrofit_generator: ^8.1.0

flutter:
  uses-material-design: true

